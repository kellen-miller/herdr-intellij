name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  semantic-pr:
    name: Semantic PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if (( ${#PR_TITLE} > 50 )); then
            echo "PR title must be 50 characters or fewer."
            exit 1
          fi

          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9]+(-[a-z0-9]+)*\))?!?: .+$'
          if ! [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must follow Conventional Commits."
            exit 1
          fi

  validate:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic
      - name: Validate plugin
        run: ./gradlew check verifyPluginProjectConfiguration buildPlugin --no-build-cache --rerun-tasks

  release:
    name: Semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install release dependencies
        run: npm ci
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
